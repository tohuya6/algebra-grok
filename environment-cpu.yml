# Local macOS / CPU conda env for algebra-grok (no CUDA). Create from the REPO ROOT:
#   conda env create -f environment-cpu.yml
#   conda activate alg-grok
# Identical to environment.yml except it drops `pytorch-cuda` and the `nvidia` channel;
# conda-forge provides osx-arm64 (Apple Silicon) CPU builds of pytorch.
name: alg-grok
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.12
  - pytorch
  - numpy
  - sympy
  - tqdm
  - matplotlib
  - ipykernel
  - wandb
  - pip
  - pip:
      - nnsight
      - -e .
